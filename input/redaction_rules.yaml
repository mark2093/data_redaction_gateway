version: "1.4"
effective_date: "2025-11-08"
rules:
  # ==============================
  # EMAIL (partial mask - preserve structure)
  # ==============================
  - id: EMAIL_REGEX
    pattern: '\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Z|a-z]{2,}\b'
    action: mask
    severity: medium
    tags: [GDPR, PRIVACY]
    enabled: true
    mask_config:
      mode: preserve_structure
      preserve_first: 1
      preserve_last: 1
      preserve_domain: true
      replacement_char: "*"
    examples:
      original: "john.doe@example.com"
      redacted: "j*******@e*******.com"
    
  # ==============================
  # CREDIT CARD / PAN (preserve last 4 with Luhn validation)
  # ==============================
  - id: LUHN_PAN
    engine: "LUHN"
    pattern: '(?:\d[ -]*?){13,19}'
    action: mask
    severity: high
    tags: [PCI_DSS_4_0]
    enabled: true  # High-confidence credit card detection with Luhn validation
    mask_config:
      mode: preserve_last
      preserve_last: 4
      replacement_char: "*"
      keep_separators: false
      validate_luhn: true
    examples:
      original: "4111111111111111"
      redacted: "************1111"
    
  # ==============================
  # PAN FALLBACK (pattern-based for non-Luhn cards)
  # ==============================
  - id: PAN_REGEX
    pattern: '\b\d{13,19}\b'
    action: mask
    severity: high
    tags: [PCI_DSS_4_0]
    enabled: true  # Fallback for test data and edge cases not caught by LUHN_PAN
    mask_config:
      mode: preserve_last
      preserve_last: 4
      replacement_char: "*"
    examples:
      original: "6427622229737661"
      redacted: "************7661"
    
  # ==============================
  # CVV (disabled - too broad, catches house numbers, years, etc.)
  # ==============================
  - id: CVV_REGEX
    pattern: '\b(?:cvv|cvc|security\s*code)\s*:?\s*(\d{3,4})\b'
    action: mask
    severity: high
    tags: [PCI_DSS_4_0]
    enabled: false
    mask_config:
      mode: full
      replacement_char: "*"
    examples:
      original: "cvv: 337"
      redacted: "cvv: ***"
    
  # ==============================
  # PHONE (preserve last 4 digits)
  # ==============================
  - id: PHONE_REGEX
    pattern: '(?:\+?\d{1,3}[-.\s])?(?:\(?\d{3}\)?[-.\s]\d{3}[-.\s]\d{4})(?:x\d{1,5})?|\b\d{3}[-.\s]\d{3}[-.\s]\d{4}\b'
    action: mask
    severity: medium
    tags: [GDPR, PRIVACY]
    enabled: true  # Re-enabled with improved pattern (requires separators to avoid matching cards)
    mask_config:
      mode: preserve_last
      preserve_last: 4
      replacement_char: "*"
      keep_separators: false
    examples:
      original_1: "881-963-7849"
      redacted_1: "***-***-7849"
      original_2: "(431)369-1017x3654"
      redacted_2: "************3654"
    
  # ==============================
  # IBAN (preserve first 2 and last 4)
  # ==============================
  - id: IBAN_REGEX
    pattern: '[A-Z]{2}\d{2}[A-Z0-9]{4}\d{7}([A-Z0-9]?){0,16}'
    action: mask
    severity: high
    tags: [PCI_DSS_4_0, GDPR]
    enabled: true
    mask_config:
      mode: preserve_first_last
      preserve_first: 4
      preserve_last: 4
      replacement_char: "*"
    examples:
      original: "GB82WEST12345698765432"
      redacted: "GB82****************5432"
    
  # ==============================
  # ACCOUNT NUMBER (preserve last 4)
  # ==============================
  - id: ACCOUNT_REGEX
    pattern: '\b\d{8,12}\b'
    action: mask
    severity: high
    tags: [PCI_DSS_4_0]
    enabled: true
    mask_config:
      mode: preserve_last
      preserve_last: 4
      replacement_char: "*"
    examples:
      original: "123456789012"
      redacted: "********9012"
    
  # ==============================
  # SSN (preserve last 4)
  # ==============================
  - id: SSN_REGEX
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    action: mask
    severity: critical
    tags: [GDPR, PRIVACY]
    enabled: true
    mask_config:
      mode: preserve_last
      preserve_last: 4
      replacement_char: "*"
      keep_separators: true
    examples:
      original: "123-45-6789"
      redacted: "***-**-6789"
    
  # ==============================
  # PERSON NAME (NER-based, full redaction)
  # ==============================
  - id: NAME_NER
    engine: "NER"
    model: "spaCy_en_core_web_sm"
    action: mask
    severity: medium
    tags: [GDPR, PRIVACY]
    enabled: true
    mask_config:
      mode: full
      replacement_char: "*"
      preserve_length: true
    examples:
      original: "Alice Johnson"
      redacted: "*************"

  # ==============================
  # CUSTOMER NAME (pattern-based fallback when NER unavailable)
  # ==============================
  - id: CUSTOMER_NAME_REGEX
    pattern: '(?:this is |my name is |i am )([A-Z][a-z]+\s+[A-Z][a-z]+)'
    action: mask
    severity: medium
    tags: [GDPR, PRIVACY]
    enabled: false  # Disabled - variable-width lookbehind not supported, NER preferred
    mask_config:
      mode: full
      replacement_char: "*"
      preserve_length: true
    examples:
      original: "this is Jane Doe"
      redacted: "this is ********"

  # ==============================
  # CVV SPECIFIC - Only in credit card contexts
  # ==============================
  - id: CVV_SPECIFIC
    pattern: '(?i)(?:cvv|cvc|security\s*code|verification\s*code)\s*:?\s*(\d{3,4})'
    action: mask
    severity: high
    tags: [PCI_DSS_4_0]
    enabled: true
    mask_config:
      mode: full
      replacement_char: "*"
    examples:
      original: "CVV: 123"
      redacted: "CVV: ***"

  # ==============================
  # NAMES in specific fields/contexts
  # ==============================  
  - id: FIELD_NAMES
    pattern: '^[A-Z][a-z]+\s+[A-Z][a-z]+$'
    action: mask
    severity: medium
    tags: [GDPR, PRIVACY]
    enabled: true
    mask_config:
      mode: full
      replacement_char: "*"
    examples:
      original: "John Smith"
      redacted: "**********"

  # ==============================
  # MERCHANT/COMPANY NAME (catch all company indicators)
  # ==============================
  - id: MERCHANT_NAME_REGEX
    pattern: '.*(?:Store|Inc|Corp|Tech).*'
    action: mask
    severity: low
    tags: [PRIVACY]
    enabled: true
    mask_config:
      mode: full
      replacement_char: "*"
    examples:
      original: "Tech Store Inc"
      redacted: "*************"

  # ==============================
  # FORMAT-PRESERVING ENCRYPTION RULES
  # ==============================
  
  # FPE for Primary Account Numbers (Credit Cards)
  - id: PAN_FPE
    pattern: '\b(?:\d[ -]*?){13,19}\b'
    action: fpe
    severity: critical
    tags: [PCI_DSS_4_0, FPE]
    enabled: false  # Disabled - using LUHN_PAN masking instead
    metadata:
      data_type: pan
      fpe_domain: numeric
      preserve_format: true
      validate_luhn: true
    examples:
      original: "4111111111111111"
      redacted: "4327649283756482"  # FPE maintains 16-digit format
    
  # FPE for Social Security Numbers
  - id: SSN_FPE
    pattern: '\b\d{3}-\d{2}-\d{4}\b'
    action: fpe
    severity: critical
    tags: [PII, HIPAA, FPE]
    enabled: false  # Disabled by default - enable as needed
    metadata:
      data_type: ssn
      fpe_domain: numeric
      preserve_format: true
      preserve_separators: true
    examples:
      original: "123-45-6789"
      redacted: "847-92-3561"  # FPE maintains XXX-XX-XXXX format
    
  # FPE for Account Numbers
  - id: ACCOUNT_FPE
    pattern: '\b(?:account|acct)\s*(?:number|#)?\s*:?\s*(\d{8,16})\b'
    action: fpe
    severity: high
    tags: [PCI_DSS_4_0, FPE]
    enabled: false  # Disabled by default
    metadata:
      data_type: account
      fpe_domain: numeric
      preserve_format: true
    examples:
      original: "account number: 1234567890"
      redacted: "account number: 8475923168"
